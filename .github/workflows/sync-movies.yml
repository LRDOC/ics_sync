name: Sync and Publish Movie Feed

on:
  workflow_dispatch:
  schedule:
    # Movie/AMC data changes far slower than Markit's live events, and AMC's
    # rate limits are undocumented — sync this feed on its own, much lower
    # cadence instead of piggybacking on the 10-minute Markit cron.
    - cron: "15 */2 * * *"

concurrency:
  group: sync-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Pages branch checkout
        run: |
          tmpdir="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -B gh-pages "${tmpdir}" origin/gh-pages
          else
            git worktree add -b gh-pages "${tmpdir}" HEAD
            find "${tmpdir}" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi
          echo "PAGES_DIR=${tmpdir}" >> "${GITHUB_ENV}"

      - name: Restore prior sync state
        run: |
          mkdir -p state/state
          if [ -d "${PAGES_DIR}/state" ]; then
            cp -R "${PAGES_DIR}/state/." state/state/
          fi

      - name: Diagnose TMDB titles
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/diagnose-tmdb.js

      - name: Run movie release sync
        env:
          AMC_THEATRE_IDS: ${{ vars.AMC_THEATRE_IDS }}
          AMC_VENDOR_KEY: ${{ secrets.AMC_VENDOR_KEY }}
          CALENDAR_NAME: Movie Release Dates
          FEED_NAME: movie-releases
          SYNC_STATE_DIR: state
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: npm run sync:movies

      - name: Build movie release Pages artifact
        env:
          CALENDAR_NAME: Movie Release Dates
          FEED_NAME: movie-releases
          SYNC_STATE_DIR: state
        run: npm run build:movies

      - name: Publish gh-pages artifacts
        run: |
          find docs -maxdepth 1 -type f -name '*.ics' -exec cp {} "${PAGES_DIR}/" \;
          cp docs/.nojekyll "${PAGES_DIR}/.nojekyll"
          mkdir -p "${PAGES_DIR}/state"
          find state/state -maxdepth 1 -type f -name '*.json' -exec cp {} "${PAGES_DIR}/state/" \;
          cd "${PAGES_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "No Pages artifact changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh movie feed artifacts"
          git push origin HEAD:gh-pages
