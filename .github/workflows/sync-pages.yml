name: Sync and Publish Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run live sync
        env:
          SYNC_STATE_DIR: state
        run: npm run sync:local

      - name: Build Pages artifacts
        env:
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/jonathan-boston-calendar
          SYNC_STATE_DIR: state
        run: npm run build:site

      - name: Commit generated state and docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state package-lock.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh generated calendar feed"
          git push

      - name: Mirror public artifacts to Pages repo
        env:
          DEPLOY_REPO_PAT: ${{ secrets.DEPLOY_REPO_PAT }}
          PUBLIC_SITE_REPO: LRDOC/jonathan-boston-calendar
        run: |
          if [ -z "${DEPLOY_REPO_PAT}" ]; then
            echo "DEPLOY_REPO_PAT is missing."
            exit 1
          fi
          tmpdir="$(mktemp -d)"
          git clone "https://x-access-token:${DEPLOY_REPO_PAT}@github.com/${PUBLIC_SITE_REPO}.git" "${tmpdir}"
          find "${tmpdir}" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp docs/jonathan-boston.ics "${tmpdir}/jonathan-boston.ics"
          cp docs/.nojekyll "${tmpdir}/.nojekyll"
          cat > "${tmpdir}/README.md" <<'EOF'
          # Jonathan Boston Calendar
          
          Public ICS deployment artifact for the Jonathan Boston events feed.

          Subscribe with:

          `https://lrdoc.github.io/jonathan-boston-calendar/jonathan-boston.ics`
          EOF
          cd "${tmpdir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No public artifact changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh public calendar site"
          git push
