name: Sync and Publish Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: sync-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Pages branch checkout
        run: |
          tmpdir="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -B gh-pages "${tmpdir}" origin/gh-pages
          else
            git worktree add -b gh-pages "${tmpdir}" HEAD
            find "${tmpdir}" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi
          echo "PAGES_DIR=${tmpdir}" >> "${GITHUB_ENV}"

      - name: Restore prior sync state
        run: |
          mkdir -p state/state
          if [ -f "${PAGES_DIR}/state/jonathan-boston.json" ]; then
            cp "${PAGES_DIR}/state/jonathan-boston.json" state/state/jonathan-boston.json
          fi

      - name: Run live sync
        env:
          SYNC_STATE_DIR: state
        run: npm run sync:local

      - name: Build Pages artifacts
        env:
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SYNC_STATE_DIR: state
        run: npm run build:site

      - name: Publish gh-pages artifacts
        run: |
          find "${PAGES_DIR}" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp docs/jonathan-boston.ics "${PAGES_DIR}/jonathan-boston.ics"
          cp docs/.nojekyll "${PAGES_DIR}/.nojekyll"
          mkdir -p "${PAGES_DIR}/state"
          cp state/state/jonathan-boston.json "${PAGES_DIR}/state/jonathan-boston.json"
          cat > "${PAGES_DIR}/README.md" <<'EOF'
          # ics_sync Pages
          
          Public GitHub Pages branch for the Jonathan Boston events feed.

          Subscribe with:

          `https://lrdoc.github.io/ics_sync/jonathan-boston.ics`
          EOF
          cd "${PAGES_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "No Pages artifact changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh Pages artifacts"
          git push origin HEAD:gh-pages
